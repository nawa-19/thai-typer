<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thai Typing Tutor 🇹🇭</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 40px 20px;
      background: #f5f5f5;
    }
    h1 {
      font-size: 2rem;
      color: #333;
      margin-bottom: 20px;
    }
    #mode-indicator {
      font-size: 0.9rem;
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 20px;
      font-weight: bold;
    }
    #mode-indicator.thai { background: #4CAF50; color: white; }
    #mode-indicator.english { background: #999; color: white; }

    #target-text {
      width: 100%;
      max-width: 600px;
      padding: 16px 20px;
      font-size: 1.8rem;
      line-height: 1.8;
      background: #fff;
      border: 2px solid #ddd;
      border-radius: 8px 8px 0 0;
      border-bottom: none;
      letter-spacing: 2px;
    }
    #target-text .correct { color: #4CAF50; }
    #target-text .wrong { color: #e53935; text-decoration: underline wavy #e53935; }
    #target-text .current { text-decoration: underline; text-underline-offset: 4px; }
    #target-text .upcoming { color: #999; }

    #typing-area {
      width: 100%;
      max-width: 600px;
      min-height: 80px;
      padding: 16px 20px;
      font-size: 1.8rem;
      line-height: 1.8;
      border: 2px solid #ddd;
      border-radius: 0 0 8px 8px;
      background: #fafafa;
      outline: none;
      white-space: pre-wrap;
      word-wrap: break-word;
      letter-spacing: 2px;
    }
    #typing-area:focus { border-color: #4CAF50; }

    #key-tracker {
      margin-top: 16px;
      max-width: 600px;
      width: 100%;
      font-family: monospace;
      font-size: 0.9rem;
      line-height: 1.6;
    }
    #correction-row, #keys-row, #position-row {
      display: flex;
      gap: 0;
    }
    .track-cell {
      width: 24px;
      text-align: center;
      flex-shrink: 0;
    }
    .track-cell.correct-hint { color: #1976D2; font-weight: bold; }
    .track-cell.key-normal { color: #555; }
    .track-cell.key-error { color: #e53935; font-weight: bold; }
    .track-cell.pos-num { color: #aaa; font-size: 0.75rem; }

    #summary {
      margin-top: 24px;
      padding: 20px;
      background: white;
      border-radius: 8px;
      border: 2px solid #4CAF50;
      max-width: 600px;
      width: 100%;
      display: none;
      text-align: center;
    }
    #summary h2 { margin: 0 0 12px; color: #333; }
    #summary .stats { font-size: 1.2rem; color: #555; }
    #summary .stats span { font-weight: bold; color: #333; }
    #restart-btn {
      margin-top: 16px;
      padding: 10px 24px;
      font-size: 1rem;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    #restart-btn:hover { background: #43A047; }

    #keyboard {
      margin-top: 24px;
      max-width: 700px;
      width: 100%;
    }
    .kb-row {
      display: flex;
      justify-content: center;
      gap: 4px;
      margin-bottom: 4px;
    }
    .kb-key {
      width: 44px;
      height: 48px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      position: relative;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
    .kb-key .thai-main {
      font-size: 1rem;
      line-height: 1;
    }
    .kb-key .thai-shift {
      font-size: 0.65rem;
      color: #999;
      line-height: 1;
    }
    .kb-key .eng-label {
      font-size: 0.85rem;
      color: #1976D2;
      position: absolute;
      bottom: 2px;
      right: 3px;
      font-family: monospace;
      font-weight: bold;
    }
    .kb-key.active {
      background: #4CAF50;
      border-color: #388E3C;
      box-shadow: 0 0 8px rgba(76,175,80,0.5);
    }
    .kb-key.active .thai-main { color: white; }
    .kb-key.active .thai-shift { color: rgba(255,255,255,0.7); }
    .kb-key.active .eng-label { color: rgba(255,255,255,0.8); }
    .kb-key.wide { width: 66px; }
    .kb-key.space { width: 240px; }

    /* Finger-to-key color coding (touch typing standard) */
    .kb-key.f-lp { background: #E1BEE7; } /* left pinky - purple */
    .kb-key.f-lr { background: #C5CAE9; } /* left ring - indigo */
    .kb-key.f-lm { background: #C8E6C9; } /* left middle - green */
    .kb-key.f-li { background: #FFF9C4; } /* left index - yellow */
    .kb-key.f-ri { background: #FFE0B2; } /* right index - orange */
    .kb-key.f-rm { background: #F8BBD0; } /* right middle - pink */
    .kb-key.f-rr { background: #B2EBF2; } /* right ring - cyan */
    .kb-key.f-rp { background: #FFCDD2; } /* right pinky - red */
    .kb-key.f-th { background: #EEEEEE; } /* thumb - gray */
    /* Active state overrides finger color */
    .kb-key.active.f-lp, .kb-key.active.f-lr, .kb-key.active.f-lm,
    .kb-key.active.f-li, .kb-key.active.f-ri, .kb-key.active.f-rm,
    .kb-key.active.f-rr, .kb-key.active.f-rp, .kb-key.active.f-th { background: #4CAF50; }

    #finger-legend {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      font-size: 0.7rem;
      color: #555;
    }
    #finger-legend .leg-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    #finger-legend .leg-swatch {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      border: 1px solid #ccc;
    }

    /* Round progress bar */
    #round-progress {
      max-width: 600px;
      width: 100%;
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }
    .round-pip {
      flex: 1;
      height: 6px;
      border-radius: 3px;
      background: #ddd;
    }
    .round-pip.done { background: #4CAF50; }
    .round-pip.current { background: #FFC107; }

    /* Lesson selection screen */
    #lesson-screen {
      max-width: 600px;
      width: 100%;
    }
    #lesson-screen h2 {
      margin: 0 0 16px;
      color: #333;
    }
    .lesson-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .lesson-item {
      padding: 14px 18px;
      margin-bottom: 8px;
      background: white;
      border: 2px solid #ddd;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .lesson-item:hover { border-color: #4CAF50; }
    .lesson-item.locked {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .lesson-item.locked:hover { border-color: #ddd; }
    .lesson-item.current {
      border-color: #4CAF50;
      background: #f0faf0;
    }
    .lesson-item .lesson-name {
      font-size: 1.1rem;
      font-weight: bold;
      color: #333;
    }
    .lesson-item .lesson-chars {
      font-size: 1.2rem;
      color: #555;
      letter-spacing: 4px;
    }
    .lesson-item .lesson-status {
      font-size: 0.85rem;
      color: #999;
    }
    .lesson-item .lesson-status.passed {
      color: #4CAF50;
      font-weight: bold;
    }

    /* Exercise screen */
    #exercise-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    #round-indicator {
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 12px;
    }
    #back-to-lessons {
      margin-bottom: 16px;
      padding: 6px 16px;
      font-size: 0.85rem;
      background: none;
      border: 1px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
      color: #666;
    }
    #back-to-lessons:hover { border-color: #999; color: #333; }

    .hint {
      margin-top: 12px;
      color: #888;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <h1 style="margin-bottom:4px">Thai Typing Tutor 🇹🇭</h1>
  <p style="margin:0 0 24px;color:#666;font-size:0.95rem;text-align:center;max-width:600px">Touch-type Thai without looking at the keys (or without a Thai keyboard at all)</p>
  <!-- Lesson selection screen -->
  <div id="lesson-screen">
    <div style="display:flex;justify-content:space-between;align-items:center;max-width:600px;width:100%">
      <h2 style="margin:0">Lessons</h2>
      <button id="weak-chars-btn" style="padding:6px 14px;font-size:0.85rem;background:none;border:1px solid #1976D2;color:#1976D2;border-radius:4px;cursor:pointer">Summary</button>
    </div>
    <div id="weak-chars-panel" style="display:none;margin:12px 0 16px;padding:16px;background:white;border:2px solid #1976D2;border-radius:8px;max-width:600px;width:100%">
    </div>
    <ul class="lesson-list" id="lesson-list"></ul>
  </div>

  <!-- Exercise screen -->
  <div id="exercise-screen">
    <button id="back-to-lessons">&larr; Lessons</button>
    <div id="mode-indicator" class="thai">TH</div>
    <div id="round-indicator"></div>
    <div id="round-progress"></div>
    <div id="target-text"></div>
    <div id="typing-area" contenteditable="true"></div>
    <div id="key-tracker">
      <div id="correction-row"></div>
      <div id="keys-row"></div>
      <div id="position-row"></div>
    </div>
    <div id="summary">
      <h2>Summary</h2>
      <div class="stats">
        Accuracy: <span id="accuracy">0</span>%<br>
        Time: <span id="time-taken">0</span> seconds
      </div>
      <button id="restart-btn">Try Again</button>
    </div>
    <div id="keyboard"></div>
    <div id="finger-legend"></div>
    <div class="hint">Esc = สลับ TH / EN</div>
  </div>

  <script>
    const KEDMANEE = {
      '`': '_', '1': 'ๅ', '2': '/', '3': '-', '4': 'ภ', '5': 'ถ',
      '6': 'ุ', '7': 'ึ', '8': 'ค', '9': 'ต', '0': 'จ', '-': 'ข',
      '=': 'ช',
      'q': 'ๆ', 'w': 'ไ', 'e': 'ำ', 'r': 'พ', 't': 'ะ', 'y': 'ั',
      'u': 'ี', 'i': 'ร', 'o': 'น', 'p': 'ย', '[': 'บ', ']': 'ล',
      '\\': 'ฃ',
      'a': 'ฟ', 's': 'ห', 'd': 'ก', 'f': 'ด', 'g': 'เ', 'h': '้',
      'j': '่', 'k': 'า', 'l': 'ส', ';': 'ว', "'": 'ง',
      'z': 'ผ', 'x': 'ป', 'c': 'แ', 'v': 'อ', 'b': 'ิ', 'n': 'ื',
      'm': 'ท', ',': 'ม', '.': 'ใ', '/': 'ฝ'
    };

    const KEDMANEE_SHIFT = {
      '~': '%', '!': '+', '@': '๑', '#': '๒', '$': '๓', '%': '๔',
      '^': 'ู', '&': '฿', '*': '๕', '(': '๖', ')': '๗', '_': '๘',
      '+': '๙',
      'Q': '๐', 'W': '"', 'E': 'ฎ', 'R': 'ฑ', 'T': 'ธ', 'Y': 'ํ',
      'U': '๊', 'I': 'ณ', 'O': 'ฯ', 'P': 'ญ', '{': 'ฐ', '}': ',',
      '|': 'ฅ',
      'A': 'ฤ', 'S': 'ฆ', 'D': 'ฏ', 'F': 'โ', 'G': 'ฌ', 'H': '็',
      'J': '๋', 'K': 'ษ', 'L': 'ศ', ':': 'ซ', '"': '.',
      'Z': '(', 'X': ')', 'C': 'ฉ', 'V': 'ฮ', 'B': 'ฺ', 'N': '์',
      'M': '?', '<': 'ฒ', '>': 'ฬ', '?': 'ฦ'
    };

    // Lesson definitions
    const LESSONS = [
      { id: 1, name: 'Lesson 1', newChars: 'ก ด น ม', words: ['กด', 'นก', 'กน', 'ดม', 'มด', 'นม'] },
      { id: 2, name: 'Lesson 2', newChars: 'า ส ว ร', words: ['กาว', 'นาม', 'สาร', 'ดาว', 'วาร', 'มาร', 'กาม', 'นาว'] },
      { id: 3, name: 'Lesson 3', newChars: 'ี ห ต ล', words: ['ดีล', 'หมาก', 'ตาล', 'หาร', 'สีดา', 'ตาม', 'หลาม', 'ลาน'] },
      { id: 4, name: 'Lesson 4', newChars: '่ ้ ง อ', words: ['น้อง', 'ของ', 'งาน', 'อ่าน', 'ง่าย', 'ล้าง', 'อาหาร', 'น้อง'] },
      { id: 5, name: 'Lesson 5', newChars: 'เ ย ข ป', words: ['เงิน', 'ขาย', 'ปาก', 'เขา', 'เปล', 'ขยาย', 'ปลา', 'เมย'] },
      { id: 6, name: 'Lesson 6', newChars: '็ ุ ู ไ', words: ['ไม้', 'กุน', 'ดูก', 'ไหม', 'สุด', 'รู้', 'ไกล', 'หมุน'] },
      { id: 7, name: 'Lesson 7', newChars: 'พ บ ช ท ค', words: ['พบ', 'ชาย', 'คนดี', 'ทาง', 'บาท', 'พาย', 'ชน', 'ทุก'] },
      { id: 8, name: 'Lesson 8', newChars: 'Greetings', words: ['สวัสดี', 'ขอบคุณ', 'สบายดี', 'ยินดี', 'หวัดดี'] },
      { id: 9, name: 'Lesson 9', newChars: 'Questions', words: ['เป็นยังไง', 'ไปไหน', 'ทำอะไร', 'กินข้าว', 'ได้ไหม'] },
      { id: 10, name: 'Lesson 10', newChars: 'Responses', words: ['ไม่เป็นไร', 'ได้เลย', 'ไม่ได้', 'โอเค', 'ดีเลย'] },
      { id: 11, name: 'Lesson 11', newChars: 'Plans', words: ['ไปด้วยกัน', 'เจอกัน', 'รอแป๊บ', 'ไปกินข้าว', 'เย็นนี้'] },
      { id: 12, name: 'Lesson 12', newChars: 'Farewell', words: ['แล้วเจอกัน', 'บายๆ', 'ฝากด้วย', 'ไว้คุยกัน', 'ลาก่อน'] },
    ];

    // Reverse lookup: Thai char -> English key
    const THAI_TO_KEY = {};
    for (const [eng, thai] of Object.entries(KEDMANEE)) {
      THAI_TO_KEY[thai] = eng;
    }
    for (const [eng, thai] of Object.entries(KEDMANEE_SHIFT)) {
      THAI_TO_KEY[thai] = 'Shift+' + eng;
    }
    THAI_TO_KEY[' '] = '␣';

    // Progress from localStorage
    // charStats: { "ก": { hits: 10, misses: 2 }, ... }
    function loadProgress() {
      try {
        const p = JSON.parse(localStorage.getItem('thaiTyperProgress'));
        if (!p) return { passed: [], charStats: {} };
        if (!p.charStats) p.charStats = {};
        return p;
      } catch { return { passed: [], charStats: {} }; }
    }
    function saveProgress(progress) {
      localStorage.setItem('thaiTyperProgress', JSON.stringify(progress));
    }

    function updateCharStats(targetText, typed) {
      const progress = loadProgress();
      for (let i = 0; i < targetText.length; i++) {
        const ch = targetText[i];
        if (ch === ' ') continue;
        if (!progress.charStats[ch]) progress.charStats[ch] = { hits: 0, misses: 0 };
        if (i < typed.length && typed[i] === ch) {
          progress.charStats[ch].hits++;
        } else {
          progress.charStats[ch].misses++;
        }
      }
      saveProgress(progress);
    }

    function getCharAccuracy(ch) {
      const progress = loadProgress();
      const stats = progress.charStats[ch];
      if (!stats || (stats.hits + stats.misses) === 0) return 0.5; // unknown = mid priority
      return stats.hits / (stats.hits + stats.misses);
    }

    function getWordWeight(word) {
      // Words with weaker characters get higher weight
      let totalWeight = 0;
      for (const ch of word) {
        if (ch === ' ') continue;
        const acc = getCharAccuracy(ch);
        // Lower accuracy = higher weight. Range: 1 (perfect) to 5 (never correct)
        totalWeight += (1 - acc) * 4 + 1;
      }
      return totalWeight;
    }

    // Screen elements
    const lessonScreen = document.getElementById('lesson-screen');
    const exerciseScreen = document.getElementById('exercise-screen');
    const lessonListEl = document.getElementById('lesson-list');

    // Exercise state
    const ROUNDS_PER_LESSON = 3;
    let currentLesson = null;
    let currentRound = 0;
    let roundResults = []; // {accuracy, time} per round
    let targetText = '';
    let typed = [];
    let keyLog = [];
    let charTimes = []; // timestamp per character typed
    let startTime = null;
    let exerciseDone = false;

    const targetEl = document.getElementById('target-text');
    const typingArea = document.getElementById('typing-area');
    const correctionRow = document.getElementById('correction-row');
    const keysRow = document.getElementById('keys-row');
    const positionRow = document.getElementById('position-row');
    const summaryEl = document.getElementById('summary');
    const modeIndicator = document.getElementById('mode-indicator');
    const roundIndicator = document.getElementById('round-indicator');

    let thaiMode = true;

    // --- Lesson screen ---
    function showLessonScreen() {
      lessonScreen.style.display = 'block';
      exerciseScreen.style.display = 'none';
      renderLessonList();
    }

    function renderLessonList() {
      const progress = loadProgress();
      let html = '';
      for (let i = 0; i < LESSONS.length; i++) {
        const lesson = LESSONS[i];
        const passed = progress.passed.includes(lesson.id);
        const unlocked = i === 0 || progress.passed.includes(LESSONS[i - 1].id);
        const isNext = unlocked && !passed;

        let cls = 'lesson-item';
        if (!unlocked) cls += ' locked';
        if (isNext) cls += ' current';

        const statusText = passed ? 'Passed' : (unlocked ? 'Ready' : 'Locked');
        const statusCls = passed ? 'passed' : '';

        html += `<li class="${cls}" data-lesson="${i}" ${!unlocked ? '' : ''}>
          <div>
            <div class="lesson-name">${lesson.name}</div>
            <div class="lesson-chars">${lesson.newChars}</div>
          </div>
          <div class="lesson-status ${statusCls}">${statusText}</div>
        </li>`;
      }
      lessonListEl.innerHTML = html;

      // Add click handlers
      lessonListEl.querySelectorAll('.lesson-item:not(.locked)').forEach(el => {
        el.addEventListener('click', () => {
          const idx = parseInt(el.dataset.lesson);
          startLesson(LESSONS[idx]);
        });
      });
    }

    // --- Exercise ---
    function getUnlockedChars(lesson) {
      // All characters from lesson 1 up to and including this lesson
      const idx = LESSONS.findIndex(l => l.id === lesson.id);
      let chars = '';
      for (let i = 0; i <= idx; i++) {
        chars += LESSONS[i].newChars.replace(/ /g, '');
      }
      return chars;
    }

    let aiWords = []; // extra words from API

    async function fetchAIWords(lesson) {
      try {
        const chars = getUnlockedChars(lesson);
        const resp = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ characters: chars, count: 8 })
        });
        if (!resp.ok) throw new Error('API error');
        const data = await resp.json();
        // Filter: only keep words that use allowed characters
        const allowed = new Set([...chars, ' ']);
        aiWords = (data.words || []).filter(w =>
          [...w].every(ch => allowed.has(ch))
        );
      } catch (e) {
        console.log('AI generation unavailable, using static words:', e.message);
        aiWords = [];
      }
    }

    async function startLesson(lesson) {
      currentLesson = lesson;
      currentRound = 0;
      roundResults = [];
      lessonScreen.style.display = 'none';
      exerciseScreen.style.display = 'flex';
      // Fetch AI words in background, don't block
      fetchAIWords(lesson);
      startExercise();
    }

    function weightedRandomPick(words) {
      const weights = words.map(w => getWordWeight(w));
      const total = weights.reduce((a, b) => a + b, 0);
      let r = Math.random() * total;
      for (let i = 0; i < words.length; i++) {
        r -= weights[i];
        if (r <= 0) return words[i];
      }
      return words[words.length - 1];
    }

    function pickExerciseText() {
      // Combine static lesson words with AI-generated words
      const allWords = [...currentLesson.words, ...aiWords];
      const count = 2 + Math.floor(Math.random() * 2); // 2 or 3 words
      const picked = [];
      for (let i = 0; i < count; i++) {
        picked.push(weightedRandomPick(allWords));
      }
      return picked.join(' ');
    }

    function renderRoundProgress() {
      const el = document.getElementById('round-progress');
      if (!el) return;
      let html = '';
      for (let i = 1; i <= ROUNDS_PER_LESSON; i++) {
        let cls = 'round-pip';
        if (i < currentRound) cls += ' done';
        else if (i === currentRound) cls += ' current';
        html += `<div class="${cls}"></div>`;
      }
      el.innerHTML = html;
    }

    function startExercise() {
      currentRound++;
      targetText = pickExerciseText();
      typed = [];
      keyLog = [];
      charTimes = [];
      startTime = null;
      exerciseDone = false;
      typingArea.textContent = '';
      summaryEl.style.display = 'none';
      roundIndicator.textContent = `${currentLesson.name}: ${currentLesson.newChars} — Round ${currentRound}/${ROUNDS_PER_LESSON}`;
      renderRoundProgress();
      renderTarget();
      renderTracker();
      typingArea.focus();
    }

    function renderTarget() {
      let html = '';
      for (let i = 0; i < targetText.length; i++) {
        const ch = targetText[i];
        if (i < typed.length) {
          if (typed[i] === ch) {
            html += `<span class="correct">${ch}</span>`;
          } else {
            html += `<span class="wrong">${ch}</span>`;
          }
        } else if (i === typed.length) {
          html += `<span class="current">${ch}</span>`;
        } else {
          html += `<span class="upcoming">${ch}</span>`;
        }
      }
      targetEl.innerHTML = html;
    }

    function renderTracker() {
      let corrHTML = '';
      let keysHTML = '';
      let posHTML = '';

      for (let i = 0; i < typed.length; i++) {
        const isSpace = targetText[i] === ' ';
        const isCorrect = typed[i] === targetText[i];

        // Correction row: blue correct key only on errors
        if (isSpace) {
          corrHTML += `<div class="track-cell">&nbsp;</div>`;
        } else if (!isCorrect) {
          const correctKey = THAI_TO_KEY[targetText[i]] || '?';
          corrHTML += `<div class="track-cell correct-hint">${correctKey}</div>`;
        } else {
          corrHTML += `<div class="track-cell">&nbsp;</div>`;
        }

        // Keys row: the English key pressed
        if (isSpace) {
          keysHTML += `<div class="track-cell">&nbsp;</div>`;
        } else {
          const cls = isCorrect ? 'key-normal' : 'key-error';
          keysHTML += `<div class="track-cell ${cls}">${keyLog[i]}</div>`;
        }

        // Position row
        if (isSpace) {
          posHTML += `<div class="track-cell">&nbsp;</div>`;
        } else {
          posHTML += `<div class="track-cell pos-num">${i + 1}</div>`;
        }
      }

      correctionRow.innerHTML = corrHTML;
      keysRow.innerHTML = keysHTML;
      positionRow.innerHTML = posHTML;
    }

    function calcTimingStats() {
      // Per-character: time between consecutive characters (skip spaces)
      const charDeltas = [];
      for (let i = 0; i < charTimes.length; i++) {
        if (targetText[i] === ' ') continue;
        const prev = i === 0 ? startTime : charTimes[i - 1];
        charDeltas.push((charTimes[i] - prev) / 1000);
      }
      const avgPerChar = charDeltas.length > 0
        ? (charDeltas.reduce((a, b) => a + b, 0) / charDeltas.length).toFixed(2)
        : '0';

      // Per-word: split target into words, sum char times per word
      const words = targetText.split(' ');
      const wordTimes = [];
      let charIdx = 0;
      for (const word of words) {
        if (word.length === 0) { charIdx++; continue; }
        const wordStart = charIdx === 0 ? startTime : charTimes[charIdx - 1];
        const wordEnd = charTimes[charIdx + word.length - 1];
        if (wordEnd) wordTimes.push((wordEnd - wordStart) / 1000);
        charIdx += word.length + 1; // +1 for space
      }
      const avgPerWord = wordTimes.length > 0
        ? (wordTimes.reduce((a, b) => a + b, 0) / wordTimes.length).toFixed(2)
        : '0';

      // WPM: standard formula = (chars / 5) / minutes elapsed.
      // Use only typed (non-space) char count and total elapsed since startTime.
      const lastT = charTimes[charTimes.length - 1];
      let wpm = 0;
      if (lastT && startTime) {
        const minutes = (lastT - startTime) / 60000;
        const charCount = typed.filter(c => c !== ' ').length;
        if (minutes > 0) wpm = Math.round((charCount / 5) / minutes);
      }

      return { avgPerChar, avgPerWord, wpm };
    }

    function showSummary() {
      exerciseDone = true;
      updateCharStats(targetText, typed);
      if (!startTime) startTime = Date.now();
      const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
      let correct = 0;
      for (let i = 0; i < targetText.length; i++) {
        if (typed[i] === targetText[i]) correct++;
      }
      const acc = Math.round((correct / targetText.length) * 100);
      const timing = calcTimingStats();
      const tooSlow = parseFloat(timing.avgPerChar) > 4;
      const passed = acc >= 80 && !tooSlow;

      if (!passed) {
        // Failed this round — must redo
        summaryEl.innerHTML = `
          <h2>Round ${currentRound}/${ROUNDS_PER_LESSON}</h2>
          <div class="stats">
            Accuracy: <span>${acc}</span>%<br>
            Time: <span>${elapsed}</span>s &nbsp; WPM: <span>${timing.wpm}</span> &nbsp; Avg/char: <span>${timing.avgPerChar}</span>s &nbsp; Avg/word: <span>${timing.avgPerWord}</span>s
          </div>
          <div style="color:#e53935;font-weight:bold;margin-top:12px">
            ${acc < 80 ? 'Need 80% accuracy to pass.' : ''}
            ${tooSlow ? 'Too slow — need under 4s per character.' : ''}
            Try again!
          </div>
          <button id="restart-btn" style="margin-top:16px;padding:10px 24px;font-size:1rem;background:#4CAF50;color:white;border:none;border-radius:6px;cursor:pointer">
            Retry Round (Enter)
          </button>
        `;
        document.getElementById('restart-btn').addEventListener('click', () => {
          currentRound--; // will be incremented back in startExercise
          startExercise();
        });
        summaryEl.style.display = 'block';
        return;
      }

      // Passed this round
      roundResults.push({ accuracy: acc, time: parseFloat(elapsed), avgPerChar: parseFloat(timing.avgPerChar), avgPerWord: parseFloat(timing.avgPerWord), wpm: timing.wpm });

      if (currentRound < ROUNDS_PER_LESSON) {
        // More rounds to go
        summaryEl.innerHTML = `
          <h2>Round ${currentRound}/${ROUNDS_PER_LESSON}</h2>
          <div class="stats">
            Accuracy: <span>${acc}</span>%<br>
            Time: <span>${elapsed}</span>s &nbsp; WPM: <span>${timing.wpm}</span> &nbsp; Avg/char: <span>${timing.avgPerChar}</span>s &nbsp; Avg/word: <span>${timing.avgPerWord}</span>s
          </div>
          <div style="color:#4CAF50;font-weight:bold;margin-top:12px">Passed!</div>
          <button id="restart-btn" style="margin-top:16px;padding:10px 24px;font-size:1rem;background:#4CAF50;color:white;border:none;border-radius:6px;cursor:pointer">
            Next Round (Enter)
          </button>
        `;
        document.getElementById('restart-btn').addEventListener('click', startExercise);
        summaryEl.style.display = 'block';
      } else {
        // All rounds done — show lesson summary
        const avgAcc = Math.round(roundResults.reduce((s, r) => s + r.accuracy, 0) / roundResults.length);
        const avgTime = (roundResults.reduce((s, r) => s + r.time, 0) / roundResults.length).toFixed(1);
        const avgCharTime = (roundResults.reduce((s, r) => s + r.avgPerChar, 0) / roundResults.length).toFixed(2);
        const avgWordTime = (roundResults.reduce((s, r) => s + r.avgPerWord, 0) / roundResults.length).toFixed(2);
        const avgWpm = Math.round(roundResults.reduce((s, r) => s + (r.wpm || 0), 0) / roundResults.length);

        const progress = loadProgress();
        if (!progress.passed.includes(currentLesson.id)) {
          progress.passed.push(currentLesson.id);
          saveProgress(progress);
        }

        const extraInfo = roundResults.map((r, i) =>
          `Round ${i + 1}: ${r.accuracy}% — ${r.time}s, ${r.wpm || 0} WPM (${r.avgPerChar}s/char, ${r.avgPerWord}s/word)`
        ).join('<br>');

        const nextIdx = LESSONS.findIndex(l => l.id === currentLesson.id) + 1;
        const hasNext = nextIdx < LESSONS.length;

        summaryEl.innerHTML = `
          <h2>Lesson Complete!</h2>
          <div class="stats">
            Average Accuracy: <span>${avgAcc}</span>%<br>
            Average WPM: <span>${avgWpm}</span><br>
            Average Time: <span>${avgTime}</span>s &nbsp; Avg/char: <span>${avgCharTime}</span>s &nbsp; Avg/word: <span>${avgWordTime}</span>s<br><br>
            ${extraInfo}
          </div>
          <div style="color:#4CAF50;font-weight:bold;margin-top:12px">
            ${hasNext ? `Next up: ${LESSONS[nextIdx].name} — ${LESSONS[nextIdx].newChars}` : 'All lessons complete!'}
          </div>
          <button id="restart-btn" style="margin-top:16px;padding:10px 24px;font-size:1rem;background:#4CAF50;color:white;border:none;border-radius:6px;cursor:pointer">
            ${hasNext ? 'Next Lesson (Enter)' : 'Back to Lessons (Enter)'}
          </button>
        `;
        document.getElementById('restart-btn').addEventListener('click', () => {
          if (hasNext) {
            startLesson(LESSONS[nextIdx]);
          } else {
            showLessonScreen();
          }
        });
        summaryEl.style.display = 'block';
      }
    }

    function updateModeIndicator() {
      modeIndicator.textContent = thaiMode ? 'TH' : 'EN';
      modeIndicator.className = thaiMode ? 'thai' : 'english';
    }

    typingArea.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        thaiMode = !thaiMode;
        updateModeIndicator();
        e.preventDefault();
        return;
      }

      if (e.key === 'Enter') { e.preventDefault(); return; }
      if (!thaiMode || exerciseDone) return;

      if (e.key === 'Backspace') {
        if (typed.length > 0) {
          typed.pop();
          keyLog.pop();
          charTimes.pop();
          renderTarget();
          renderTracker();
        }
        return;
      }

      // Space handling
      if (e.key === ' ') {
        e.preventDefault();
        if (typed.length >= targetText.length) return;
        if (!startTime) startTime = Date.now();
        charTimes.push(Date.now());
        typed.push(' ');
        keyLog.push(' ');
        document.execCommand('insertText', false, ' ');
        renderTarget();
        renderTracker();
        if (typed.length === targetText.length) showSummary();
        return;
      }

      const mapped = e.shiftKey ? KEDMANEE_SHIFT[e.key] : KEDMANEE[e.key];
      if (!mapped) return;
      if (typed.length >= targetText.length) return;

      e.preventDefault();
      if (!startTime) startTime = Date.now();

      const englishKey = e.shiftKey ? e.key : e.key;
      charTimes.push(Date.now());
      typed.push(mapped);
      keyLog.push(englishKey);
      document.execCommand('insertText', false, mapped);
      renderTarget();
      renderTracker();

      if (typed.length === targetText.length) showSummary();
    });

    document.getElementById('restart-btn').addEventListener('click', startExercise);
    document.getElementById('back-to-lessons').addEventListener('click', showLessonScreen);

    document.getElementById('weak-chars-btn').addEventListener('click', () => {
      const panel = document.getElementById('weak-chars-panel');
      if (panel.style.display !== 'none') {
        panel.style.display = 'none';
        return;
      }
      const progress = loadProgress();
      const stats = progress.charStats || {};
      const entries = Object.entries(stats)
        .map(([ch, s]) => ({ ch, acc: s.hits / (s.hits + s.misses), hits: s.hits, misses: s.misses }))
        .sort((a, b) => a.acc - b.acc);

      let html = '';
      if (entries.length === 0) {
        html = '<div style="color:#888;text-align:center">No data yet — complete some exercises first!</div>';
      } else {
        const top5 = entries.slice(0, 5);
        html = '<div style="font-weight:bold;margin-bottom:8px;color:#333">Top 5 Weak Characters</div>';
        html += '<table style="width:100%;text-align:center;border-collapse:collapse">';
        html += '<tr style="color:#888;font-size:0.8rem"><th>Character</th><th>Accuracy</th><th>Correct</th><th>Wrong</th></tr>';
        for (const e of top5) {
          const accPct = Math.round(e.acc * 100);
          const color = accPct >= 80 ? '#4CAF50' : accPct >= 50 ? '#FF9800' : '#e53935';
          const engKey = THAI_TO_KEY[e.ch] || '?';
          html += `<tr>
            <td style="font-size:1.4rem;padding:6px">${e.ch} <span style="font-size:0.75rem;color:#1976D2">(${engKey})</span></td>
            <td style="color:${color};font-weight:bold">${accPct}%</td>
            <td style="color:#4CAF50">${e.hits}</td>
            <td style="color:#e53935">${e.misses}</td>
          </tr>`;
        }
        html += '</table>';
      }
      html += `<div style="margin-top:16px;display:flex;gap:8px;justify-content:center">
        <button id="reset-stats-btn" style="padding:6px 14px;font-size:0.8rem;background:none;border:1px solid #FF9800;color:#FF9800;border-radius:4px;cursor:pointer">Reset Stats Only</button>
        <button id="reset-all-btn" style="padding:6px 14px;font-size:0.8rem;background:none;border:1px solid #e53935;color:#e53935;border-radius:4px;cursor:pointer">Reset Everything</button>
      </div>`;
      panel.innerHTML = html;

      document.getElementById('reset-stats-btn').addEventListener('click', () => {
        if (!confirm('Reset all character accuracy stats? Your lesson progress will be kept.')) return;
        const progress = loadProgress();
        progress.charStats = {};
        saveProgress(progress);
        panel.style.display = 'none';
        document.getElementById('weak-chars-btn').click();
      });

      document.getElementById('reset-all-btn').addEventListener('click', () => {
        if (!confirm('Reset everything? This will lock all lessons and clear all stats.')) return;
        localStorage.removeItem('thaiTyperProgress');
        panel.style.display = 'none';
        renderLessonList();
      });

      panel.style.display = 'block';
    });

    // Enter key to advance when exercise is done
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && exerciseDone) {
        e.preventDefault();
        document.getElementById('restart-btn').click();
      }
    });

    // Keyboard layout: each row is an array of [englishKey, thaiNormal, thaiShift]
    const KB_ROWS = [
      [['`','_','%'],['1','ๅ','+'],['2','/','๑'],['3','-','๒'],['4','ภ','๓'],['5','ถ','๔'],['6','ุ','ู'],['7','ึ','฿'],['8','ค','๕'],['9','ต','๖'],['0','จ','๗'],['-','ข','๘'],['=','ช','๙']],
      [['q','ๆ','๐'],['w','ไ','"'],['e','ำ','ฎ'],['r','พ','ฑ'],['t','ะ','ธ'],['y','ั','ํ'],['u','ี','๊'],['i','ร','ณ'],['o','น','ฯ'],['p','ย','ญ'],['[','บ','ฐ'],[']','ล',','],['\\','ฃ','ฅ']],
      [['a','ฟ','ฤ'],['s','ห','ฆ'],['d','ก','ฏ'],['f','ด','โ'],['g','เ','ฌ'],['h','้','็'],['j','่','๋'],['k','า','ษ'],['l','ส','ศ'],[';','ว','ซ'],["'",'ง','.']],
      [['z','ผ','('],['x','ป',')'],['c','แ','ฉ'],['v','อ','ฮ'],['b','ิ','ฺ'],['n','ื','์'],['m','ท','?'],[',','ม','ฒ'],['.','ใ','ฬ'],['/','ฝ','ฦ']],
      [['space',' ',' ']]
    ];

    // Touch-typing finger assignments (QWERTY standard)
    const FINGER_MAP = {
      '`':'f-lp','1':'f-lp','q':'f-lp','a':'f-lp','z':'f-lp',
      '2':'f-lr','w':'f-lr','s':'f-lr','x':'f-lr',
      '3':'f-lm','e':'f-lm','d':'f-lm','c':'f-lm',
      '4':'f-li','5':'f-li','r':'f-li','t':'f-li','f':'f-li','g':'f-li','v':'f-li','b':'f-li',
      '6':'f-ri','7':'f-ri','y':'f-ri','u':'f-ri','h':'f-ri','j':'f-ri','n':'f-ri','m':'f-ri',
      '8':'f-rm','i':'f-rm','k':'f-rm',',':'f-rm',
      '9':'f-rr','o':'f-rr','l':'f-rr','.':'f-rr',
      '0':'f-rp','-':'f-rp','=':'f-rp','p':'f-rp','[':'f-rp',']':'f-rp','\\':'f-rp',';':'f-rp',"'":'f-rp','/':'f-rp',
      'space':'f-th'
    };
    const FINGER_LEGEND = [
      ['f-lp','L pinky'],['f-lr','L ring'],['f-lm','L middle'],['f-li','L index'],
      ['f-ri','R index'],['f-rm','R middle'],['f-rr','R ring'],['f-rp','R pinky'],
      ['f-th','Thumbs']
    ];

    const keyboardEl = document.getElementById('keyboard');

    function renderKeyboard() {
      // Figure out which key to highlight
      let highlightKey = null;
      if (!exerciseDone && typed.length < targetText.length) {
        const nextChar = targetText[typed.length];
        if (nextChar === ' ') {
          highlightKey = 'space';
        } else {
          // Find which English key produces this Thai char
          for (const [eng, thai] of Object.entries(KEDMANEE)) {
            if (thai === nextChar) { highlightKey = eng; break; }
          }
          if (!highlightKey) {
            for (const [eng, thai] of Object.entries(KEDMANEE_SHIFT)) {
              if (thai === nextChar) { highlightKey = 'shift+' + eng.toLowerCase(); break; }
            }
          }
        }
      }

      let html = '';
      for (const row of KB_ROWS) {
        html += '<div class="kb-row">';
        for (const [eng, thai, thaiShift] of row) {
          const isSpace = eng === 'space';
          const isActive = highlightKey === eng || highlightKey === eng.toLowerCase();
          const fingerCls = FINGER_MAP[eng] || '';
          const cls = [
            'kb-key',
            isSpace ? 'space' : '',
            fingerCls,
            isActive ? 'active' : ''
          ].filter(Boolean).join(' ');

          if (isSpace) {
            html += `<div class="${cls}"><span class="thai-main">Space</span></div>`;
          } else {
            html += `<div class="${cls}" data-key="${eng}">` +
              `<span class="thai-shift">${thaiShift}</span>` +
              `<span class="thai-main">${thai}</span>` +
              `<span class="eng-label">${eng}</span>` +
              `</div>`;
          }
        }
        html += '</div>';
      }
      keyboardEl.innerHTML = html;
      // Render finger legend (once)
      const legendEl = document.getElementById('finger-legend');
      if (legendEl && !legendEl.dataset.rendered) {
        legendEl.innerHTML = FINGER_LEGEND.map(([cls, label]) =>
          `<div class="leg-item"><div class="leg-swatch ${cls}"></div>${label}</div>`
        ).join('');
        legendEl.dataset.rendered = '1';
      }
    }

    // Patch renderTarget to also update keyboard
    const origRenderTarget = renderTarget;
    function renderTargetAndKeyboard() {
      origRenderTarget();
      renderKeyboard();
    }
    // Replace all calls
    renderTarget = renderTargetAndKeyboard;

    // Auto-start: pick the next unfinished lesson, or show lesson list
    (function autoStart() {
      const progress = loadProgress();
      const nextLesson = LESSONS.find((l, i) =>
        !progress.passed.includes(l.id) && (i === 0 || progress.passed.includes(LESSONS[i - 1].id))
      );
      if (nextLesson) {
        startLesson(nextLesson);
      } else {
        showLessonScreen();
      }
    })();
  </script>
</body>
</html>
