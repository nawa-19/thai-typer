<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thai Typing Tutor</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 40px 20px;
      background: #f5f5f5;
    }
    h1 {
      font-size: 2rem;
      color: #333;
      margin-bottom: 20px;
    }
    #mode-indicator {
      font-size: 0.9rem;
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 20px;
      font-weight: bold;
    }
    #mode-indicator.thai {
      background: #4CAF50;
      color: white;
    }
    #mode-indicator.english {
      background: #999;
      color: white;
    }
    #typing-area {
      width: 100%;
      max-width: 600px;
      min-height: 200px;
      padding: 20px;
      font-size: 1.8rem;
      line-height: 1.8;
      border: 2px solid #ddd;
      border-radius: 8px;
      background: white;
      outline: none;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    #typing-area:focus {
      border-color: #4CAF50;
    }
    #key-history {
      margin-top: 16px;
      font-size: 0.95rem;
      color: #555;
      min-height: 1.5em;
      max-width: 600px;
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .key-entry {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .key-entry .key-label {
      background: #e0e0e0;
      padding: 1px 6px;
      border-radius: 3px;
      font-family: monospace;
      font-size: 0.85rem;
      border: 1px solid #ccc;
    }
    .key-entry .thai-char {
      font-size: 1.1rem;
    }
    .hint {
      margin-top: 12px;
      color: #888;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <h1>Thai Typing Tutor</h1>
  <div id="mode-indicator" class="thai">TH</div>
  <div id="typing-area" contenteditable="true" autofocus></div>
  <div id="key-history"></div>
  <div class="hint">Esc = สลับ TH / EN</div>

  <script>
    const KEDMANEE = {
      '`': '_', '1': 'ๅ', '2': '/', '3': '-', '4': 'ภ', '5': 'ถ',
      '6': 'ุ', '7': 'ึ', '8': 'ค', '9': 'ต', '0': 'จ', '-': 'ข',
      '=': 'ช',
      'q': 'ๆ', 'w': 'ไ', 'e': 'ำ', 'r': 'พ', 't': 'ะ', 'y': 'ั',
      'u': 'ี', 'i': 'ร', 'o': 'น', 'p': 'ย', '[': 'บ', ']': 'ล',
      '\\': 'ฃ',
      'a': 'ฟ', 's': 'ห', 'd': 'ก', 'f': 'ด', 'g': 'เ', 'h': '้',
      'j': '่', 'k': 'า', 'l': 'ส', ';': 'ว', "'": 'ง',
      'z': 'ผ', 'x': 'ป', 'c': 'แ', 'v': 'อ', 'b': 'ิ', 'n': 'ื',
      'm': 'ท', ',': 'ม', '.': 'ใ', '/': 'ฝ'
    };

    const KEDMANEE_SHIFT = {
      '~': '%', '!': '+', '@': '๑', '#': '๒', '$': '๓', '%': '๔',
      '^': 'ู', '&': '฿', '*': '๕', '(': '๖', ')': '๗', '_': '๘',
      '+': '๙',
      'Q': '๐', 'W': '"', 'E': 'ฎ', 'R': 'ฑ', 'T': 'ธ', 'Y': 'ํ',
      'U': '๊', 'I': 'ณ', 'O': 'ฯ', 'P': 'ญ', '{': 'ฐ', '}': ',',
      '|': 'ฅ',
      'A': 'ฤ', 'S': 'ฆ', 'D': 'ฏ', 'F': 'โ', 'G': 'ฌ', 'H': '็',
      'J': '๋', 'K': 'ษ', 'L': 'ศ', ':': 'ซ', '"': '.',
      'Z': '(', 'X': ')', 'C': 'ฉ', 'V': 'ฮ', 'B': 'ฺ', 'N': '์',
      'M': '?', '<': 'ฒ', '>': 'ฬ', '?': 'ฦ'
    };

    let thaiMode = true;
    const modeIndicator = document.getElementById('mode-indicator');
    const typingArea = document.getElementById('typing-area');
    const keyHistory = document.getElementById('key-history');

    function addKeyToHistory(englishKey, thaiChar) {
      const label = englishKey === ' ' ? 'Space' : englishKey;
      const entry = document.createElement('span');
      entry.className = 'key-entry';
      entry.innerHTML = `<span class="key-label">${label}</span>`;
      keyHistory.appendChild(entry);
      keyHistory.scrollLeft = keyHistory.scrollWidth;
    }

    function updateModeIndicator() {
      if (thaiMode) {
        modeIndicator.textContent = 'TH';
        modeIndicator.className = 'thai';
      } else {
        modeIndicator.textContent = 'EN';
        modeIndicator.className = 'english';
      }
    }

    typingArea.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        thaiMode = !thaiMode;
        updateModeIndicator();
        e.preventDefault();
        return;
      }

      if (!thaiMode) return;

      const mapped = e.shiftKey ? KEDMANEE_SHIFT[e.key] : KEDMANEE[e.key];

      if (e.key === 'Backspace') {
        if (keyHistory.lastChild) keyHistory.removeChild(keyHistory.lastChild);
        return;
      }

      if (e.key === ' ') {
        const entry = document.createElement('span');
        entry.className = 'key-entry';
        entry.innerHTML = `<span style="width:12px;display:inline-block"></span>`;
        keyHistory.appendChild(entry);
        return;
      }

      if (mapped) {
        e.preventDefault();
        document.execCommand('insertText', false, mapped);
        addKeyToHistory(e.shiftKey ? 'Shift+' + e.key : e.key, mapped);
      }
    });

    typingArea.focus();
  </script>
</body>
</html>
